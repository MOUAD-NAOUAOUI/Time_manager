# Server Port
server.port=${PORT:${BACKEND_PORT:8080}}

# PostgreSQL Database Configuration (Dynamically resolved from environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:aws-1-eu-west-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
# Maximum number of connections in the pool (default: 10)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
# Minimum number of idle connections maintained by HikariCP (default: same as maximum-pool-size)
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
# Maximum time (ms) a client will wait for a connection from the pool (default: 30000)
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
# Maximum lifetime (ms) of a connection in the pool (default: 1800000 = 30 min)
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
# Maximum idle time (ms) for a connection (default: 600000 = 10 min)
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
# Connection test query (not needed for PostgreSQL — driver has built-in alive check)
# spring.datasource.hikari.connection-test-query=SELECT 1

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cookie.secure=${COOKIE_SECURE:false}

# AI Microservice Configuration
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
ai.service.internal-token=${AI_SERVICE_INTERNAL_TOKEN}
# AI service HTTP client timeout configuration (milliseconds)
ai.service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:5000}
ai.service.read-timeout=${AI_SERVICE_READ_TIMEOUT:30000}

# Redis Configuration (for Rate Limiting & Caching)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Rate Limiting Configuration (auth endpoints)
rate.limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}
rate.limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
rate.limit.lockout-seconds=${RATE_LIMIT_LOCKOUT_SECONDS:900}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# AES-256 Database Encryption Key (32-byte Base64 key)
app.encryption.key=${APP_ENCRYPTION_KEY}
