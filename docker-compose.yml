version: '3.8'
services:
  postgres:
    image: ankane/pgvector:latest
    container_name: intelligent_time_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ONEPIECE1000ONEPIECE56
      POSTGRES_DB: smart_time
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: intelligent_time_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
